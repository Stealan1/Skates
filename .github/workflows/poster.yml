# Stealan1/Skates .github/workflows/poster.yml
# The CSM Poster page commits poster/poster.json (or poster.html); this renders skates-p8-poster-<realm>.png
# at the repo root of the same branch, so the raw image links never change.
name: poster
on:
  push:
    paths: ["poster/**"]
  workflow_dispatch:
concurrency:
  group: poster-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: python3 poster/render.py --out .
      - name: Commit the PNGs
        # The branch can move while we render (another render, a clients.csv push): put our PNGs on top of the
        # newest tip each try instead of rebasing, so two renders never conflict on the same image files.
        run: |
          git config user.name "skates-poster"
          git config user.email "skates-poster@users.noreply.github.com"
          mkdir -p /tmp/png && cp skates-p8-poster-*.png /tmp/png/
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            cp /tmp/png/*.png .
            git add skates-p8-poster-*.png
            if git diff --cached --quiet; then echo "no image change"; exit 0; fi
            git commit -q -m "poster: render [skip ci]" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "push failed after 5 tries"; exit 1
