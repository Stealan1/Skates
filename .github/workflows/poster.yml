# Stealan1/Skates .github/workflows/poster.yml
# The CSM Poster page commits poster/poster.json (or poster.html); this renders skates-p8-poster-<realm>.png
# onto the image branch (one commit, replaced each render), so the raw image links never change.
name: poster
on:
  push:
    paths: ["poster/**"]
  workflow_dispatch:
concurrency:
  group: poster-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: python3 poster/render.py --out .
      - name: Publish the PNGs
        # The images live on their own branch holding ONE commit, replaced by every render (force push): old images
        # leave the history, so the repo never grows. main -> poster-images, any other branch X -> poster-images-X
        # (fleet/hub/poster.py img_branch() has the same rule). Concurrency above cancels an older run, so last wins.
        run: |
          IMG=poster-images; [ "${GITHUB_REF_NAME}" = main ] || IMG="poster-images-${GITHUB_REF_NAME}"
          git config user.name "skates-poster"
          git config user.email "skates-poster@users.noreply.github.com"
          git checkout -q --orphan "$IMG"
          git rm -rq --cached .
          git add -f skates-p8-poster-*.png
          git commit -q -m "poster: render of ${GITHUB_SHA::7}"
          git push -q -f origin "HEAD:refs/heads/$IMG"
          echo "published to $IMG: $(git ls-files | tr '\n' ' ')"
